site_name: Docs for the Bavarian Forest National Park Project

site_url: https://wild-ecol-cons.github.io/webapp-besuchermonitoring-nationalpark-bayerischer-wald/

theme:
  name: "material"
  features:
    - navigation.indexes

plugins:
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_root_full_path: true

markdown_extensions:
  - attr_list
  - md_in_html

# Review markers for the Nov 2026 docs update (see docs/stylesheets/doc-updates.css)
extra_css:
  - stylesheets/doc-updates.css

nav:
  - Home: index.md
  - project-factsheet.md
  - Our Approach:
    - approach/index.md
    - approach/data.md
    - approach/prediction-pipeline.md
    - approach/user-frontends.md
  - findings-and-results.md
  - limitations-and-challenges.md
  - open-issues.md
  - api-reference.md
  